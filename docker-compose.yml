version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pune-traffic-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DEBUG=true
      - SECRET_KEY=smart-city-pune-hinjawadi-traffic-key-2026
      - DATABASE_URL=sqlite:///./traffic_system.db
      - SIMULATION_MODE=true
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: pune-traffic-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
